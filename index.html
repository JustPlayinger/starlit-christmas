<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>星愿 · Starlit Christmas</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020509;color:#f6e5c4;font-family:"Microsoft YaHei",sans-serif}#scene{width:100%;height:100%;display:block}#copy{position:absolute;inset:0;pointer-events:none;width:100%;height:100%}.tools{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:flex;gap:7px;padding:9px;background:#0b101bd9;border:1px solid #d9be7d30;border-radius:14px;backdrop-filter:blur(18px);transition:opacity .4s;max-width:96vw;z-index:3}.tools button,.tools select{font:12px "Microsoft YaHei",sans-serif;color:#e6d7b9;border:0;border-radius:7px;padding:10px 12px;white-space:nowrap;background:#ffffff09;cursor:pointer}.tools button:hover{background:#d6ae5030}.tools .primary{background:#d7b97b;color:#17130b}.clean .tools{opacity:0;pointer-events:none}.hint{position:absolute;top:20px;left:22px;font-size:11px;letter-spacing:2px;color:#a99d85;transition:opacity .5s;pointer-events:none}.clean .hint{opacity:0}#status{position:absolute;left:50%;top:30px;transform:translateX(-50%);font-size:12px;color:#f8dfaa;pointer-events:none}dialog{background:#0c111b;color:#e9d8b4;border:1px solid #9e8450;padding:25px;max-width:90vw;border-radius:12px}dialog input{display:block;width:290px;max-width:100%;padding:12px;margin:15px 0;background:#03070d;color:#fff0cf;border:1px solid #6e6046}dialog button{padding:10px 22px;background:#dfc287;border:0;border-radius:5px;cursor:pointer}#fallback{display:none;position:absolute;inset:35% 10%;text-align:center;line-height:2}@media(max-width:600px){.tools{bottom:12px;gap:3px;padding:6px}.tools button,.tools select{font-size:10px;padding:9px 7px}.hint{font-size:9px;left:16px}}
</style>
</head>
<body>
<canvas id="scene" aria-label="旋转的金色星光粒子圣诞树"></canvas><canvas id="copy" aria-hidden="true"></canvas>
<div class="hint">星愿 · STARLIT CHRISTMAS</div><div id="status" role="status" aria-live="polite"></div>
<div class="tools" aria-label="作品控制">
<button id="replay" class="primary">重播开场</button><button id="burst">星光绽放</button><button id="edit">祝福语</button><select id="theme" aria-label="配色"><option value="gold">香槟金</option><option value="ice">冰雪蓝</option></select><button id="full">全屏</button><button id="hide">纯净画面</button><button id="record">导出竖屏</button>
</div>
<dialog id="editor"><form method="dialog"><label for="wish">写下你的祝福（最多 24 字）</label><input id="wish" maxlength="24" value="愿所有美好，如期而至"><button>保存</button></form></dialog>
<div id="fallback">此浏览器未能启用 WebGL。<br>请用开启硬件加速的 Chrome 或 Edge 打开本文件。</div>
<script>
'use strict';
const overlayMode=new URLSearchParams(location.search).get('overlay')==='1';
if(overlayMode){document.documentElement.style.background='transparent';document.body.style.background='transparent';document.querySelector('.tools').style.display='none';document.querySelector('.hint').style.display='none';}
const canvas=document.querySelector('#scene'),copy=document.querySelector('#copy'),ctx=copy.getContext('2d');
const gl=canvas.getContext('webgl',{alpha:overlayMode,antialias:false,preserveDrawingBuffer:true});
if(!gl){document.querySelector('#fallback').style.display='block';throw new Error('WebGL unavailable');}
const vs=`
attribute vec3 aPos;attribute vec3 aMeta;
uniform float uTime,uAspect,uIntro,uBurst,uDpr;uniform vec2 uPointer;
varying vec3 vColor;varying float vAlpha;varying float vType;
void main(){
float t=uTime;float kind=aMeta.x;float seed=aMeta.y;float size=aMeta.z;vec3 p=aPos;
if(kind<2.5){
float angle=t*.135+uPointer.x*.13;float c=cos(angle),s=sin(angle);p.xz=mat2(c,-s,s,c)*p.xz;
float gather=smoothstep(seed*.65,1.0,uIntro);
vec3 scattered=vec3(sin(seed*876.3)*7.,cos(seed*481.2)*5.,sin(seed*314.6)*4.);
p=mix(scattered,p,gather);p+=normalize(p+vec3(.01))*uBurst*(1.+seed)*1.8;
p.y+=sin(t*.8+seed*40.)*.012;
}else if(kind<3.5){p.y=mod(aPos.y-t*(.12+seed*.22)+6.,12.)-6.;p.x+=sin(t*.35+seed*60.)*.18;}
else if(kind<4.5){float a=t*.07;p.xz=mat2(cos(a),-sin(a),sin(a),cos(a))*p.xz;}
float tilt=.095+uPointer.y*.03;float yy=p.y*cos(tilt)-p.z*sin(tilt);float zz=p.y*sin(tilt)+p.z*cos(tilt);
float camera=10.8+.12*sin(t*.21);float depth=camera-zz;float scale=1.92/depth;
float framing=min(1.,uAspect/.60);
float vertical=uAspect<.8?1.2:1.;
vec2 pos=vec2(p.x/uAspect,(yy+.18)*vertical)*scale*framing;
gl_Position=vec4(pos,0.,1.);gl_PointSize=clamp(size*(11./depth)*uDpr*framing,1.,45.);
float flicker=.65+.35*sin(t*(1.2+seed*3.)+seed*130.);
vAlpha=flicker;vType=kind;
if(kind<.5){vColor=mix(vec3(.18,.46,.35),vec3(.79,.72,.39),seed);vAlpha*=.66;}
else if(kind<1.5){vColor=mix(vec3(1.,.48,.13),vec3(1.,.86,.5),seed);vAlpha*=.95;}
else if(kind<2.5){vColor=mix(vec3(.9,.16,.12),vec3(1.,.76,.27),step(.32,seed));vAlpha=.8;}
else if(kind<3.5){vColor=vec3(.64,.77,1.);vAlpha*=.4;}
else if(kind<4.5){vColor=vec3(.85,.59,.26);vAlpha*=.32;}
else{vColor=vec3(.57,.68,.86);vAlpha*=.5;}
vAlpha*=kind<2.5?(.3+.7*smoothstep(0.,.8,uIntro)):1.;
}`;
const fs=`precision mediump float;varying vec3 vColor;varying float vAlpha;varying float vType;uniform float uIce;
void main(){vec2 q=gl_PointCoord-.5;float r=length(q)*2.;if(r>1.)discard;
float core=exp(-r*r*35.);float halo=exp(-r*r*5.)*.24;float cross=pow(max(0.,1.-abs(q.x)*30.),8.)*exp(-abs(q.y)*12.)*.15+pow(max(0.,1.-abs(q.y)*30.),8.)*exp(-abs(q.x)*12.)*.15;
vec3 color=mix(vColor,vec3(vColor.b*.55+vColor.r*.25,vColor.r*.72+vColor.g*.3,vColor.r),uIce);
gl_FragColor=vec4(color,(core+halo+cross)*vAlpha);}`;
function shader(type,src){let s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s;}
const program=gl.createProgram();gl.attachShader(program,shader(gl.VERTEX_SHADER,vs));gl.attachShader(program,shader(gl.FRAGMENT_SHADER,fs));gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(program));gl.useProgram(program);
let randState=251225;function random(){randState=(Math.imul(1664525,randState)+1013904223)>>>0;return randState/4294967296;}
const positions=[],meta=[];function add(x,y,z,type,size){positions.push(x,y,z);meta.push(type,random(),size);}
// Whorls of individual branches create a fir silhouette, rather than a solid cone.
for(let tier=0;tier<16;tier++){
 const h=tier/16,y=-2.25+h*4.5,radius=1.85*Math.pow(1-h,.88)+.03;
 for(let branch=0;branch<13;branch++){
  const angle=branch/13*Math.PI*2+tier*2.399;
  for(let j=0;j<68;j++){
   const f=Math.pow(random(),.55),spread=(random()-.5)*.37;
   const a=angle+spread*(.3+f),r=radius*f;
   add(Math.cos(a)*r,y+.34*(1-f)+(random()-.5)*.1,Math.sin(a)*r,0,1.5+random()*3.8);
  }
 }
}
// Three fine, braided helices of warm light.
for(let i=0;i<6200;i++){
 const h=i/6200,a=h*Math.PI*2*7.5,r=1.94*Math.pow(1-h,.88)+.035;
 const jitter=(random()-.5)*.055;
 add(Math.cos(a+jitter)*(r+jitter),-2.25+h*4.8+jitter,Math.sin(a+jitter)*(r+jitter),1,2+random()*5);
}
for(let i=0;i<280;i++){
 const h=random()*.95,a=random()*Math.PI*2,r=1.88*Math.pow(1-h,.88);
 add(Math.cos(a)*r,-2.25+h*4.5,Math.sin(a)*r,2,5+random()*9);
}
for(let i=0;i<950;i++)add((random()-.5)*15,(random()-.5)*12,(random()-.5)*8,3,1.5+random()*4);
for(let i=0;i<4400;i++){
 const a=random()*Math.PI*2,r=Math.pow(random(),.65)*3.65;
 add(Math.cos(a)*r,-2.42+random()*.035,Math.sin(a)*r,4,1.5+random()*3.5);
}
for(let ring=0;ring<3;ring++)for(let i=0;i<900;i++){
 const a=i/900*Math.PI*2,r=2.2+ring*.43+(random()-.5)*.016;
 add(Math.cos(a)*r,-2.4,Math.sin(a)*r,4,2.3);
}
for(let i=0;i<500;i++)add((random()-.5)*18,(random()-.5)*12,-5-random()*5,5,1+random()*3);
for(const [name,data] of [['aPos',positions],['aMeta',meta]]){const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(data),gl.STATIC_DRAW);const a=gl.getAttribLocation(program,name);gl.enableVertexAttribArray(a);gl.vertexAttribPointer(a,3,gl.FLOAT,false,0,0);}
const uniforms={};for(const n of ['uTime','uAspect','uIntro','uBurst','uDpr','uPointer','uIce'])uniforms[n]=gl.getUniformLocation(program,n);
gl.enable(gl.BLEND);gl.blendFuncSeparate(gl.SRC_ALPHA,gl.ONE,gl.ONE,gl.ONE_MINUS_SRC_ALPHA);if(overlayMode)gl.clearColor(0,0,0,0);else gl.clearColor(.008,.017,.031,1);
let start=performance.now(),burstAt=-100,paused=false,lastTime=0,pauseAt=0,ice=false,wish='愿所有美好，如期而至',pointer=[0,0],recorder=null,recordCanvas=null,recordCtx=null,recordStart=0,recordStream=null,exporting=false,previousClean=false;
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
function resize(){const d=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(innerWidth*d);canvas.height=Math.round(innerHeight*d);copy.width=canvas.width;copy.height=canvas.height;gl.viewport(0,0,canvas.width,canvas.height);}
addEventListener('resize',resize);resize();
function ease(a,b,t){let v=Math.min(1,Math.max(0,(t-a)/(b-a)));return v*v*(3-2*v);}
function lettering(c,w,h,t){
 const portrait=w/h<.8;const scale=Math.min(h/1000,w/620);const aspect=w/h;const framing=Math.min(1,aspect/.60);
 const starX=w/2,starY=h/2-(2.56+.18)*1.92/(10.8-2.56*.095)*framing*(portrait?1.2:1)*h/2;
 const alpha=ease(1.8,4.2,t);c.save();c.globalAlpha=alpha;
 // A luminous five-point star with restrained optical flare.
 c.translate(starX,starY);const glow=c.createRadialGradient(0,0,0,0,0,70*scale);glow.addColorStop(0,ice?'#d2f6ffdd':'#ffe5a8ee');glow.addColorStop(.12,ice?'#9beaff65':'#ffbc5e65');glow.addColorStop(1,'#d9952900');c.fillStyle=glow;c.fillRect(-70*scale,-70*scale,140*scale,140*scale);
 c.rotate(Math.sin(t*.4)*.05);c.fillStyle=ice?'#e5faff':'#fff2c9';c.shadowColor=ice?'#73d8ff':'#ffbd5f';c.shadowBlur=18*scale;c.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,r=(i%2?5.5:14)*scale;c.lineTo(Math.cos(a)*r,Math.sin(a)*r);}c.closePath();c.fill();
 c.shadowBlur=0;for(let i=0;i<8;i++){c.save();c.rotate(i*Math.PI/4+t*.025);const g=c.createLinearGradient(0,0,75*scale,0);g.addColorStop(0,'#fff4d9c0');g.addColorStop(1,'#ffe4aa00');c.fillStyle=g;c.beginPath();c.moveTo(0,-1*scale);c.lineTo((i%2?39:75)*scale,0);c.lineTo(0,1*scale);c.fill();c.restore();}c.restore();
 const y=portrait?h*.775:h*.83;
 c.save();c.globalAlpha=ease(3.4,5.8,t);c.textAlign='center';c.fillStyle=ice?'#daf2ff':'#f5dca8';c.shadowColor=ice?'#75d0ff':'#c79c4f';c.shadowBlur=18*scale;
 c.font=`italic ${54*scale}px Georgia, 'Times New Roman', serif`;c.fillText('Merry Christmas',w/2,y,w*.85);
 c.shadowBlur=0;c.fillStyle=ice?'#a2c4d6':'#baab91';c.font=`${17*scale}px 'Microsoft YaHei', sans-serif`;c.fillText(wish,w/2,y+35*scale,w*.8);
 c.fillStyle=ice?'#708f9f':'#776a53';c.font=`${9*scale}px Georgia, serif`;c.fillText('✦   MAY YOUR WISHES FIND THEIR LIGHT   ✦',w/2,y+65*scale,w*.83);c.restore();
}
function draw(now){
 requestAnimationFrame(draw);let t=paused?pauseAt:(now-start)/1000;if(reduced&&!exporting)t=8;
 lastTime=t;let intro=Math.min(1,t/4.8);let b=Math.max(0,1-(t-burstAt)/2.4);b=b>0?Math.sin((1-b)*Math.PI)*.8:0;
 gl.uniform1f(uniforms.uTime,t);gl.uniform1f(uniforms.uIntro,intro);gl.uniform1f(uniforms.uBurst,b);gl.uniform1f(uniforms.uAspect,canvas.width/canvas.height);gl.uniform1f(uniforms.uDpr,canvas.height/1000*2);gl.uniform2f(uniforms.uPointer,...pointer);gl.uniform1f(uniforms.uIce,ice?1:0);
 gl.clear(gl.COLOR_BUFFER_BIT);gl.drawArrays(gl.POINTS,0,positions.length/3);ctx.clearRect(0,0,copy.width,copy.height);lettering(ctx,copy.width,copy.height,t);
 if(recorder&&recorder.state==='recording'){
  recordCtx.drawImage(canvas,0,0,1080,1920);lettering(recordCtx,1080,1920,t);
  const remaining=Math.max(0,Math.ceil(20-(now-recordStart)/1000));document.querySelector('#status').textContent=`正在导出 · ${remaining}s`;
  if(now-recordStart>=20000)recorder.stop();
 }
}
requestAnimationFrame(draw);
function replay(){start=performance.now();paused=false;burstAt=-100;}
function clean(){document.body.classList.toggle('clean');}
document.querySelector('#replay').onclick=replay;document.querySelector('#burst').onclick=()=>burstAt=lastTime;
document.querySelector('#hide').onclick=clean;document.querySelector('#full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch(e){notice('请使用浏览器 F11 进入全屏');}};
document.querySelector('#theme').onchange=e=>ice=e.target.value==='ice';document.querySelector('#edit').onclick=()=>document.querySelector('#editor').showModal();document.querySelector('#editor').onclose=()=>wish=document.querySelector('#wish').value.trim()||'愿所有美好，如期而至';
addEventListener('pointermove',e=>{if(!exporting)pointer=[e.clientX/innerWidth-.5,e.clientY/innerHeight-.5];});
addEventListener('keydown',e=>{if(document.querySelector('#editor').open||exporting)return;if(e.code==='Space'){e.preventDefault();paused=!paused;if(paused)pauseAt=lastTime;else start=performance.now()-pauseAt*1000;}if(e.key.toLowerCase()==='h')clean();if(e.key.toLowerCase()==='r')replay();if(e.key.toLowerCase()==='b')burstAt=lastTime;if(e.key==='Escape')document.body.classList.remove('clean');});
function notice(s){document.querySelector('#status').textContent=s;setTimeout(()=>{if(!exporting)document.querySelector('#status').textContent='';},4500);}
document.querySelector('#record').onclick=()=>{
 if(exporting)return;if(!window.MediaRecorder||!HTMLCanvasElement.prototype.captureStream){notice('此浏览器不支持导出，请用 Chrome / Edge 或直接录屏');return;}
 const mime=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'].find(x=>MediaRecorder.isTypeSupported(x));if(!mime){notice('浏览器没有可用的视频编码器，请直接录屏');return;}
 exporting=true;previousClean=document.body.classList.contains('clean');document.body.classList.add('clean');pointer=[0,0];
 // Render natively in 9:16 throughout capture, independent of the window shape.
 canvas.width=1080;canvas.height=1920;copy.width=1080;copy.height=1920;gl.viewport(0,0,1080,1920);
 recordCanvas=document.createElement('canvas');recordCanvas.width=1080;recordCanvas.height=1920;recordCtx=recordCanvas.getContext('2d');let chunks=[];
 try{recordStream=recordCanvas.captureStream(30);recorder=new MediaRecorder(recordStream,{mimeType:mime,videoBitsPerSecond:14000000});
 recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};
 recorder.onstop=()=>{const url=URL.createObjectURL(new Blob(chunks,{type:mime}));const a=document.createElement('a');a.href=url;a.download='星愿-圣诞树-1080x1920.webm';a.click();setTimeout(()=>URL.revokeObjectURL(url),60000);finishRecording();notice('竖屏视频已生成 · 20 秒 / 1080 × 1920 / 无音轨');};
 recorder.onerror=()=>{finishRecording();notice('导出失败，请直接录屏');};
 replay();recordStart=performance.now();recorder.start(1000);
 }catch(e){finishRecording();notice('无法启动视频编码，请直接录屏');}
};
function finishRecording(){if(recordStream)recordStream.getTracks().forEach(t=>t.stop());exporting=false;recorder=null;recordCanvas=null;recordCtx=null;if(!previousClean)document.body.classList.remove('clean');resize();}
addEventListener('resize',()=>{if(exporting){canvas.width=1080;canvas.height=1920;copy.width=1080;copy.height=1920;gl.viewport(0,0,1080,1920);}});
</script>
</body>
